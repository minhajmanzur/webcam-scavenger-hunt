<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Webcam Scavenger Hunt preview</title>
  <desc id="desc">Illustrative preview of a webcam scavenger hunt interface with everyday-object detection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a32"/>
      <stop offset="1" stop-color="#080d19"/>
    </linearGradient>
    <linearGradient id="scene" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7f4f5"/>
      <stop offset="1" stop-color="#b9d5d4"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c58e5d"/>
      <stop offset="1" stop-color="#986442"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000814" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="690" rx="30" fill="url(#bg)"/>
  <circle cx="1090" cy="54" r="150" fill="#1d4ed8" opacity=".09"/>
  <circle cx="70" cy="650" r="190" fill="#16a394" opacity=".08"/>

  <text x="58" y="73" fill="#9baec8" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3">A LITTLE COMPUTER VISION GAME</text>
  <text x="58" y="124" fill="#f7fbff" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="800">Webcam Scavenger Hunt</text>
  <text x="58" y="160" fill="#b8c8dc" font-family="Segoe UI, Arial, sans-serif" font-size="19">Find everyday objects. Hold them steady. Beat the timer.</text>

  <g filter="url(#shadow)">
    <rect x="52" y="196" width="1096" height="420" rx="22" fill="#111a29" stroke="#34445c" stroke-width="2"/>
    <path d="M74 196h1052a22 22 0 0 1 22 22v30H52v-30a22 22 0 0 1 22-22Z" fill="#1c293b"/>
    <circle cx="80" cy="224" r="6" fill="#fb7185"/>
    <circle cx="102" cy="224" r="6" fill="#fbbf24"/>
    <circle cx="124" cy="224" r="6" fill="#34d399"/>
    <text x="160" y="230" fill="#dbe7f4" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">LIVE OBJECT DETECTION</text>
    <text x="1098" y="230" text-anchor="end" fill="#92a6bf" font-family="Segoe UI, Arial, sans-serif" font-size="13">ILLUSTRATIVE PREVIEW</text>

    <rect x="76" y="266" width="744" height="324" rx="14" fill="url(#scene)"/>
    <circle cx="720" cy="320" r="38" fill="#fff4c1" opacity=".72"/>
    <path d="M76 478c115-60 211-55 330-2 130 58 256 56 414-25v139H76Z" fill="#b4cbc4"/>
    <path d="M76 520c186-35 382-34 744-5v75H76Z" fill="url(#table)"/>
    <path d="M76 520c186-35 382-34 744-5" fill="none" stroke="#e6b886" stroke-width="5" opacity=".72"/>

    <!-- bottle -->
    <g transform="translate(142 365)">
      <rect x="25" y="0" width="26" height="18" rx="5" fill="#167b8b"/>
      <path d="M22 18h32l6 20v92q0 12-12 12H28q-12 0-12-12V38Z" fill="#32b7bd" stroke="#11717b" stroke-width="4"/>
      <path d="M24 57h29v33H24Z" fill="#e7f7f5" opacity=".84"/>
      <path d="M25 31v75" stroke="#a8eeee" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    </g>
    <rect x="126" y="347" width="92" height="174" rx="10" fill="none" stroke="#34d399" stroke-width="3"/>
    <rect x="126" y="324" width="108" height="24" rx="6" fill="#073c36"/>
    <text x="136" y="341" fill="#c7f9df" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">bottle 94%</text>

    <!-- cup -->
    <g transform="translate(275 416)">
      <path d="M12 0h83l-8 83q-3 22-25 22H44q-22 0-25-22Z" fill="#fffaf0" stroke="#d9cbb4" stroke-width="4"/>
      <path d="M94 18h19q22 0 17 24-4 20-32 20" fill="none" stroke="#fffaf0" stroke-width="12"/>
      <path d="M21 25h67" stroke="#d57b55" stroke-width="6" opacity=".8"/>
      <ellipse cx="53" cy="5" rx="39" ry="8" fill="#7d503a"/>
    </g>
    <rect x="265" y="399" width="152" height="135" rx="10" fill="none" stroke="#60a5fa" stroke-width="3"/>
    <rect x="265" y="376" width="82" height="24" rx="6" fill="#15355f"/>
    <text x="275" y="393" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">cup 89%</text>

    <!-- carrot -->
    <g transform="translate(468 408) rotate(-17)">
      <path d="M22 18 86 31 43 133Q33 151 28 131L7 38Q3 19 22 18Z" fill="#fb8c39" stroke="#e56c22" stroke-width="4"/>
      <path d="M29 18Q14-1 8-19M38 20Q38-5 46-19M46 23Q62 4 73-4" fill="none" stroke="#3b9e5b" stroke-width="8" stroke-linecap="round"/>
      <path d="m22 48 22 5M28 72l19 5M33 96l14 4" stroke="#ffd08a" stroke-width="4" stroke-linecap="round"/>
    </g>
    <rect x="455" y="379" width="126" height="184" rx="10" fill="none" stroke="#34d399" stroke-width="3"/>
    <rect x="455" y="356" width="112" height="24" rx="6" fill="#073c36"/>
    <text x="465" y="373" fill="#c7f9df" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">carrot 91%</text>

    <!-- book -->
    <g transform="translate(620 427) rotate(5)">
      <path d="M0 9q35-12 77 4v91q-40-16-77-4Z" fill="#fffdf5" stroke="#d3d8d9" stroke-width="3"/>
      <path d="M77 13q39-17 79-3v91q-42-13-79 3Z" fill="#f6f0de" stroke="#d3d8d9" stroke-width="3"/>
      <path d="M77 13v91" stroke="#aab5bd" stroke-width="4"/>
      <path d="M14 35h47M14 51h47M14 67h43M94 37h45M94 53h45M94 69h39" stroke="#91a0a8" stroke-width="3" opacity=".68"/>
    </g>
    <rect x="610" y="418" width="182" height="132" rx="10" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <rect x="610" y="395" width="92" height="24" rx="6" fill="#3b286c"/>
    <text x="620" y="412" fill="#ede9fe" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">book 87%</text>

    <!-- side panel -->
    <rect x="844" y="266" width="280" height="324" rx="16" fill="#172337" stroke="#30425b"/>
    <text x="870" y="305" fill="#8da4bf" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2">YOUR HUNT</text>
    <text x="870" y="350" fill="#f5f9ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">Find a bottle</text>
    <rect x="870" y="370" width="226" height="1" fill="#33445d"/>
    <text x="870" y="410" fill="#92a6bf" font-family="Segoe UI, Arial, sans-serif" font-size="14">SCORE</text>
    <text x="1096" y="410" text-anchor="end" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">200</text>
    <text x="870" y="451" fill="#92a6bf" font-family="Segoe UI, Arial, sans-serif" font-size="14">TIME LEFT</text>
    <text x="1096" y="451" text-anchor="end" fill="#f9c76a" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">01:24</text>
    <rect x="870" y="480" width="226" height="46" rx="12" fill="#173c38"/>
    <text x="983" y="509" text-anchor="middle" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">HOLD STEADY TO CONFIRM</text>
    <text x="870" y="557" fill="#91a4bb" font-family="Segoe UI, Arial, sans-serif" font-size="12">Python · OpenCV · YOLO26n</text>
  </g>

  <text x="600" y="657" text-anchor="middle" fill="#70839d" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1.3">ILLUSTRATIVE PREVIEW — NOT A CAPTURED GAME SCREEN</text>
</svg>
