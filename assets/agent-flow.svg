<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Scavenger hunt agent flow</title>
  <desc id="desc">Illustration of the pipeline from webcam capture through YOLO detection, persistence, agent tools, and scoring or hints.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a32"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#7891b1"/>
    </marker>
  </defs>
  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <text x="54" y="55" fill="#eef5ff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">FROM CAMERA FRAME TO GAME ACTION</text>
  <text x="54" y="83" fill="#91a5bf" font-family="Segoe UI, Arial, sans-serif" font-size="14">A local, transparent pipeline — every agent action is logged.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="48" y="118" width="190" height="108" rx="16" fill="#17253a" stroke="#38506d"/>
    <text x="68" y="155" fill="#67e8f9" font-size="13" font-weight="800" letter-spacing="1.4">01 · CAMERA</text>
    <text x="68" y="187" fill="#f0f6ff" font-size="18" font-weight="700">Capture frame</text>
    <text x="68" y="209" fill="#9cb0c8" font-size="13">OpenCV webcam</text>

    <path d="M245 172h32" stroke="#7891b1" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="286" y="118" width="190" height="108" rx="16" fill="#17253a" stroke="#38506d"/>
    <text x="306" y="155" fill="#60a5fa" font-size="13" font-weight="800" letter-spacing="1.4">02 · DETECT</text>
    <text x="306" y="187" fill="#f0f6ff" font-size="18" font-weight="700">Find objects</text>
    <text x="306" y="209" fill="#9cb0c8" font-size="13">YOLO26n classes</text>

    <path d="M483 172h32" stroke="#7891b1" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="524" y="118" width="190" height="108" rx="16" fill="#17253a" stroke="#38506d"/>
    <text x="544" y="155" fill="#a78bfa" font-size="13" font-weight="800" letter-spacing="1.4">03 · STABILIZE</text>
    <text x="544" y="187" fill="#f0f6ff" font-size="18" font-weight="700">Hold ~1 second</text>
    <text x="544" y="209" fill="#9cb0c8" font-size="13">Ignore brief flicker</text>

    <path d="M721 172h32" stroke="#7891b1" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="762" y="118" width="190" height="108" rx="16" fill="#17253a" stroke="#38506d"/>
    <text x="782" y="155" fill="#fbbf24" font-size="13" font-weight="800" letter-spacing="1.4">04 · AGENT</text>
    <text x="782" y="187" fill="#f0f6ff" font-size="18" font-weight="700">Use small tools</text>
    <text x="782" y="209" fill="#9cb0c8" font-size="13">Detect · color · hint</text>

    <path d="M959 172h32" stroke="#7891b1" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1000" y="118" width="152" height="108" rx="16" fill="#173a34" stroke="#2f806f"/>
    <text x="1018" y="155" fill="#6ee7b7" font-size="13" font-weight="800" letter-spacing="1.2">05 · GAME</text>
    <text x="1018" y="187" fill="#f0fff8" font-size="18" font-weight="700">Score / hint</text>
    <text x="1018" y="209" fill="#a4d8c8" font-size="13">Advance target</text>
  </g>
</svg>
